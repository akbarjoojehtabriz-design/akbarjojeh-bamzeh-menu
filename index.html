<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a91616">
<title>منوی آنلاین | اکبرجوجه بامزه</title>
<style>
:root{--red:#a91616;--deep:#781010;--orange:#f47700;--gold:#ffc21a;--cream:#fffaf0;--ink:#29211d;--muted:#756b65}
*{box-sizing:border-box}body{margin:0;background:#fffaf3;color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--deep),var(--red) 60%,#d94a08);color:white;padding:24px 16px 20px;text-align:center;border-bottom:6px solid var(--gold)}
header img{width:116px;height:116px;object-fit:cover;border-radius:50%;border:4px solid white;background:white}
h1{font-size:25px;margin:12px 0 4px}header p{margin:0;color:#ffe7c5;font-size:13px}
.wrap{max-width:920px;margin:auto;padding:16px}
.notice{background:#fff1d3;border:1px solid #f5d38b;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.9;margin:8px 0 16px}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;position:sticky;top:0;background:#fffaf3;z-index:2}
.tabs button{white-space:nowrap;border:1px solid #e8c6a1;background:white;color:var(--deep);border-radius:22px;padding:9px 14px;font:inherit;font-size:13px}
.tabs button.active{background:var(--red);color:white;border-color:var(--red)}
section{margin:20px 0}h2{font-size:19px;color:var(--deep);border-right:5px solid var(--orange);padding-right:10px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{background:white;border:1px solid #f0e3d5;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #5d2b1110}
.item img{width:100%;height:165px;object-fit:cover;background:#f3f0ed;display:block}
.info{padding:12px}.name{font-weight:bold;font-size:15px;margin-bottom:7px}.desc{font-size:12px;color:var(--muted);line-height:1.7;min-height:18px}
.price{color:var(--red);font-weight:bold;font-size:15px;margin-top:8px}
.rowprice{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed #ead8c7;padding-top:8px;margin-top:8px;font-size:13px}
.rowprice b{color:var(--red)}
.simple{background:white;border:1px solid #f0e3d5;border-radius:12px;padding:11px 13px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.simple b{color:var(--red);white-space:nowrap}
footer{text-align:center;background:#fff0d6;color:#6f3a20;padding:22px 12px;margin-top:30px;font-size:13px;line-height:1.9}
.small{font-size:11px;color:var(--muted)}
@media(max-width:480px){header{padding-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item img{height:125px}.info{padding:9px}.name{font-size:13px}.desc{font-size:11px}.price{font-size:13px}.wrap{padding:12px}}
</style>
</head>
<body>
<header>
<img src="logo.jpg" alt="لوگوی اکبرجوجه بامزه">
<h1>اکبرجوجه بامزه</h1>
<p>منوی آنلاین رستوران</p>
</header>
<main class="wrap">
<div class="notice">قیمت‌ها به تومان هستند و به‌صورت هزار تومان نمایش داده شده‌اند. برای غذاهای کبابی و خورشتی، قیمت خوراک بدون برنج ۱۷۰ هزار تومان کمتر از قیمت همراه برنج است.</div>
<nav class="tabs" id="tabs"></nav>
<div id="menu"></div>
</main>
<footer>اکبرجوجه بامزه<br><span class="small">این نسخه نمونه است؛ قیمت‌ها و عکس‌ها پیش از انتشار نهایی قابل ویرایش‌اند.</span></footer>
<script>
const sections = [
{title:"اکبرجوجه", items:[
{name:"اکبرجوجه", rice:930, noRice:760, image:"images/akbarjojeh-rice.jpg", noRiceImage:"images/akbarjojeh-no-rice.jpg", desc:"همراه سس مخصوص"}
]},
{title:"کته کباب و جوجه", items:[
{name:"جوجه کباب", rice:250, noRice:80, image:"images/joojeh-rice.jpg", noRiceImage:"images/joojeh-no-rice.jpg"},
{name:"کباب کوبیده", rice:750, noRice:580, image:"images/koobideh-rice.jpg"},
{name:"کباب چنجه", rice:1900, noRice:1730},
{name:"کباب ترش", rice:1900, noRice:1730},
{name:"کباب کوبیده مخصوص", rice:1050, noRice:880},
{name:"کباب کوبیده دو سیخ", rice:1100, noRice:930},
{name:"کباب کوبیده بازاری", rice:1150, noRice:980},
{name:"کباب دیگی", rice:800, noRice:630},
{name:"جوجه کباب مخصوص", rice:850, noRice:680},
{name:"جوجه کباب ترش", rice:900, noRice:730},
{name:"کباب وزیری", rice:1100, noRice:930}
]},
{title:"کته خورشت", items:[
{name:"زرشک‌پلو با مرغ", rice:750, noRice:580},
{name:"خورشت فسنجان با مرغ", rice:910, noRice:740},
{name:"خورشت فسنجان با گوشت", rice:940, noRice:770},
{name:"خورشت قورمه‌سبزی", rice:790, noRice:620},
{name:"خورشت قیمه سیب‌زمینی", rice:790, noRice:620}
]},
{title:"کته ماهی", items:[
{name:"کته ماهی قزل‌آلا", priceText:"۱٬۲۹۰ تا ۱٬۳۴۰", desc:"قیمت درج‌شده در منوی فعلی؛ نوع پخت نیازمند تأیید"}
]},
{title:"غذاهای گیاهی", items:[
{name:"کشک بادمجان", price:420},{name:"میرزا قاسمی",price:380},{name:"باقالا قاتق",price:410}
]},
{title:"کته اضافه", items:[
{name:"کته زعفرانی",price:300},{name:"کته سماق",price:330},{name:"کته سبزی",price:330}
]},
{title:"سوپ و آش",items:[
{name:"سوپ زعفرانی",price:130},{name:"آش رشته مخصوص",price:180}
]},
{title:"سالاد",items:[
{name:"سالاد فصل",price:200},{name:"سالاد کلم",price:170},{name:"سالاد شیرازی",price:150}
]},
{title:"پیش‌غذا",items:[
{name:"ماست",price:130},{name:"ماست بورانی",price:170},{name:"سیرماست",price:140},{name:"ماست‌وخیار",price:150},{name:"ماست دلار",price:150},{name:"سیرترشی",price:110},{name:"ترشی",price:50},{name:"زیتون",price:150},{name:"زیتون پرورده",price:200}
]},
{title:"سرویس کامل و نوشیدنی",items:[
{name:"سرویس کامل",price:450,desc:"سوپ، سالاد، ماست و نوشیدنی"},{name:"انواع نوشیدنی",priceText:"قیمت روز"}
]},
{title:"سایر",items:[{name:"خوراک بال و ماهیچه مرغ",price:200}]}
];
const fmt=n=>new Intl.NumberFormat('fa-IR').format(n*1000)+" تومان";
const tabs=document.getElementById('tabs'), menu=document.getElementById('menu');
sections.forEach((s,i)=>{
 const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>document.getElementById('s'+i).scrollIntoView({behavior:'smooth',block:'start'});tabs.appendChild(b);
 const sec=document.createElement('section');sec.id='s'+i;sec.innerHTML=`<h2>${s.title}</h2><div class="grid"></div>`;const grid=sec.querySelector('.grid');
 s.items.forEach(it=>{
  const card=document.createElement('article');card.className='item';
  if(it.image){const img=document.createElement('img');img.src=it.image;img.alt=it.name;card.appendChild(img)}
  const info=document.createElement('div');info.className='info';
  let html=`<div class="name">${it.name}</div>${it.desc?`<div class="desc">${it.desc}</div>`:''}`;
  if(it.rice!==undefined){html+=`<div class="rowprice"><span>با کته</span><b>${fmt(it.rice)}</b></div><div class="rowprice"><span>خوراک بدون برنج</span><b>${fmt(it.noRice)}</b></div>`}
  else if(it.price!==undefined){html+=`<div class="price">${fmt(it.price)}</div>`}
  else {html+=`<div class="price">${it.priceText}</div>`}
  info.innerHTML=html;card.appendChild(info);grid.appendChild(card);
 });menu.appendChild(sec);
});
</script>
</body></html>
